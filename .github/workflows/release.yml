# .github/workflows/release.yml
# Triggered when you push a version tag (e.g. v2.2.0).
#
# What it does:
#   1. refuses to release when the tag and package.json disagree;
#   2. runs the full suite and the type-check;
#   3. publishes to npm — only if NPM_TOKEN is configured;
#   4. creates a GitHub Release whose notes are the CHANGELOG section for that
#      version, not a generated list of merge commits.
#
# Setup (one time):
#   1. npm → Access Tokens → Generate Granular Token, Packages: Read and write
#   2. GitHub → Settings → Secrets and variables → Actions → NPM_TOKEN
#
# Releasing:
#   npm version patch|minor|major   # bumps package.json and creates the tag
#   git push --follow-tags

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # npm provenance

jobs:
  release:
    name: Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_PLAYWRIGHT_INSTALL: '1'

      # A tag that does not match package.json publishes the wrong version.
      - name: Verify tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG package=$PKG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Run the suite
        run: npm test
        env:
          CI: 'true'

      - name: Type-check
        run: npm run typecheck

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          node scripts/changelog-section.js "${GITHUB_REF_NAME}" > release-notes.md
          echo "--- notes ---"
          head -20 release-notes.md

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          append_body: true
          generate_release_notes: false
          files: |
            release-notes.md
          footer: |
            ---

            **Install**

            ```bash
            npm install -g @puneet-swarup/forge-agent@${{ github.ref_name }}
            ```
