# .github/workflows/ci.yml
# Runs on every push and pull request.
#
# Node 20, 22 and 24 on Ubuntu. Node 18 is EOL (Apr 2025) and is not tested.
#
# The suite is the gate: coverage thresholds in package.json fail the build when
# the number drops, and the browser job runs the suites that skip everywhere a
# Chromium cannot launch.

name: CI

on:
  push:
    branches: [ main, dev, 'feature/**', 'fix/**', 'feat/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # SKIP_PLAYWRIGHT_INSTALL=1 prevents postinstall from downloading
      # Chromium (~150 MB) — the unit suite does not need a real browser.
      - name: Install dependencies
        run: npm ci
        env:
          SKIP_PLAYWRIGHT_INSTALL: '1'

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true   # warn but do not block

      - name: Type-check (JSDoc / @ts-check modules)
        run: npm run typecheck

      # Parses every file in src/ and tests/, not a hand-maintained list that
      # silently misses whatever was added last.
      - name: Check for syntax errors
        run: npm run check:syntax:all

      - name: Run test suite with coverage
        run: npm run test:coverage
        env:
          CI: 'true'

      - name: Upload coverage report
        if: matrix.node-version == 20    # upload once
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Coverage summary
        if: matrix.node-version == 20
        run: |
          node -e "
            const fs = require('fs');
            const p = 'coverage/coverage-summary.json';
            if (!fs.existsSync(p)) { console.log('no summary'); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(p, 'utf8')).total;
            const line = ['statements','branches','functions','lines']
              .map(k => k + ': ' + t[k].pct + '%').join(' | ');
            console.log('Coverage — ' + line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Coverage\n\n' + line + '\n');
          "

  # -- Integration: real headless Chromium against a local mock chat page --
  integration:
    name: Integration (browser E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      # Install WITHOUT skipping Playwright this time (needs Chromium).
      - name: Install dependencies (with Chromium)
        run: npm ci

      - name: Install Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npx jest tests/integration-browser.test.js tests/integration-supervisor.test.js tests/integration-auto-loop.test.js --runInBand
        env:
          CI: 'true'
