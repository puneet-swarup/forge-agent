
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Ollama Chat</title>

  <style>
    :root {
      --bg-color: #1e1e2e;
      --container-bg: #252538;
      --text-color: #cdd6f4;
      --border-color: #45475a;
      --accent-color: #89b4fa;
      --user-msg: #313244;
      --assistant-msg: #45475a;
      --error: #f38ba8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 1rem;
      background: var(--container-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    #status {
      color: #a6adc8;
      font-size: .85rem;
    }

    #chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: min(85%, 900px);
      padding: .8rem 1.2rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: var(--user-msg);
    }

    .assistant {
      align-self: flex-start;
      background: var(--assistant-msg);
    }

    .error {
      color: var(--error);
    }

    .input-area {
      padding: 1rem;
      background: var(--container-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: .5rem;
    }

    textarea#chat-input {
      flex: 1;
      min-width: 0;
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: .8rem;
      resize: vertical;
      min-height: 50px;
      max-height: 180px;
      font: inherit;
    }

    textarea#chat-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      background: var(--accent-color);
      color: var(--bg-color);
      border: 0;
      border-radius: 8px;
      padding: .65rem 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .stop-gen-btn {
      background: var(--error);
    }

    #loading-indicator {
      display: none;
      padding: 0 1.5rem .75rem;
      color: #a6adc8;
    }

    @media (max-width: 600px) {
      #chat-container {
        padding: 1rem;
      }

      .message {
        max-width: 95%;
      }

      .input-area {
        padding: .7rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>DeepSeek Ollama Workspace</h2>
    <span id="status">Checking Ollama connection...</span>
    <button id="new-chat-btn" type="button">New Chat</button>
  </header>

  <main id="chat-container" aria-live="polite"></main>

  <div id="loading-indicator">DeepSeek is thinking...</div>

  <div class="input-area">
    <textarea
      id="chat-input"
      placeholder="Ask anything... (Enter to send, Shift+Enter for a new line)"
      aria-label="Message"
    ></textarea>

    <button type="button" id="send-btn">Send</button>
  </div>

  <script>
    'use strict';

    const chatContainer = document.getElementById('chat-container');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const loadingIndicator = document.getElementById('loading-indicator');
    const newChatBtn = document.getElementById('new-chat-btn');
    const statusEl = document.getElementById('status');

    const MODEL = 'deepseek-r1-16k:latest';

    const messages = [];

    let isGenerating = false;
    let activeController = null;

    function appendMessage(role, text = '') {
      const node = document.createElement('div');
      node.className = `message ${role}`;

      const content = document.createElement('div');
      content.className = 'message-text';
      content.textContent = text;

      node.appendChild(content);
      chatContainer.appendChild(node);

      chatContainer.scrollTop = chatContainer.scrollHeight;

      return content;
    }

    function setGeneratingState(generating) {
      isGenerating = generating;

      sendBtn.textContent = generating ? 'Stop' : 'Send';
      sendBtn.classList.toggle('stop-gen-btn', generating);

      loadingIndicator.style.display =
        generating ? 'block' : 'none';

      chatInput.disabled = generating;
    }

    async function readResponse(response) {
      const raw = await response.text();
      const contentType =
        response.headers.get('content-type') || '';

      if (!response.ok) {
        let detail = raw;

        try {
          const parsed = JSON.parse(raw);
          detail =
            parsed.error?.message ||
            parsed.error ||
            parsed.message ||
            raw;
        } catch (_) {}

        throw new Error(
          `HTTP ${response.status}: ${String(detail).slice(0, 700)}`
        );
      }

      if (!contentType.toLowerCase().includes('application/json')) {
        throw new Error(
          `Expected JSON but received ${contentType || 'unknown content type'}. ` +
          `Response: ${raw.slice(0, 500)}`
        );
      }

      try {
        return JSON.parse(raw);
      } catch (_) {
        throw new Error(
          `Invalid JSON response: ${raw.slice(0, 500)}`
        );
      }
    }

    async function checkHealth() {
      try {
        const response = await fetch('/health', {
          method: 'GET',
          headers: {
            Accept: 'application/json'
          },
          cache: 'no-store'
        });

        const data = await readResponse(response);

        if (!data.ok) {
          throw new Error('Ollama proxy reported that it is unavailable.');
        }

        statusEl.textContent =
          `Connected to ${data.provider || 'Ollama'} · ${data.model || MODEL}`;

      } catch (error) {
        statusEl.textContent = `Connection error: ${error.message}`;
        console.error('Health check failed:', error);
      }
    }

    function consumeSseBlock(block, onContent, onThinking) {
      const dataLines = block
        .split(/\r?\n/)
        .filter(line => line.startsWith('data:'))
        .map(line => line.slice(5).trim());

      if (dataLines.length === 0) {
        return false;
      }

      const data = dataLines.join('\n');

      if (data === '[DONE]') {
        return true;
      }

      let parsed;

      try {
        parsed = JSON.parse(data);
      } catch (_) {
        throw new Error(
          `Invalid streaming JSON: ${data.slice(0, 500)}`
        );
      }

      if (parsed.error) {
        throw new Error(
          parsed.error.message ||
          JSON.stringify(parsed.error)
        );
      }

      const choice = parsed.choices?.[0];
      const delta = choice?.delta;

      // DeepSeek may send reasoning before the actual answer.
      // Do not display the reasoning text; just update the status.
      const reasoning =
        delta?.reasoning ??
        delta?.reasoning_content ??
        '';

      if (typeof reasoning === 'string' && reasoning.length > 0) {
        onThinking();
      }

      // Display only the actual assistant answer.
      const content = delta?.content;

      if (typeof content === 'string' && content.length > 0) {
        onContent(content);
      }

      return false;
    }

    async function readStreamingResponse(
      response,
      onContent,
      onThinking
    ) {
      if (!response.ok) {
        const raw = await response.text();

        throw new Error(
          `HTTP ${response.status}: ${raw.slice(0, 700)}`
        );
      }

      const contentType =
        response.headers.get('content-type') || '';

      // Support non-streaming JSON responses too.
      if (!contentType.toLowerCase().includes('text/event-stream')) {
        const data = await readResponse(response);

        const answer = data.choices?.[0]?.message?.content;

        if (typeof answer !== 'string') {
          throw new Error(
            `Unexpected model response: ${JSON.stringify(data).slice(0, 700)}`
          );
        }

        onContent(answer);
        return;
      }

      if (!response.body) {
        throw new Error('Streaming response has no readable body.');
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      let buffer = '';
      let finished = false;

      try {
        while (!finished) {
          const result = await reader.read();

          if (result.value) {
            buffer += decoder.decode(result.value, {
              stream: !result.done
            });
          }

          // Process every complete SSE event in the buffer.
          let boundary;

          while ((boundary = buffer.search(/\r?\n\r?\n/)) !== -1) {
            const block = buffer.slice(0, boundary);

            const separator = buffer
              .slice(boundary)
              .match(/^\r?\n\r?\n/)[0];

            buffer = buffer.slice(
              boundary + separator.length
            );

            if (consumeSseBlock(
              block,
              onContent,
              onThinking
            )) {
              finished = true;
              break;
            }
          }

          if (result.done) {
            break;
          }
        }

        // Process any remaining final event.
        buffer += decoder.decode();

        if (buffer.trim() && !finished) {
          consumeSseBlock(buffer, onContent, onThinking);
        }

      } finally {
        if (finished) {
          try {
            await reader.cancel();
          } catch (_) {}
        }

        reader.releaseLock();
      }
    }

	function buildRequestMessages() {
	  const MAX_MESSAGES = 8;
	  const MAX_CHARS = 12000;

	  const selected = [];
	  let remaining = MAX_CHARS;

	  for (
		let i = messages.length - 1;
		i >= 0 && selected.length < MAX_MESSAGES;
		i--
	  ) {
		const message = messages[i];
		let content = message.content;

		if (content.length > remaining) {
		  if (selected.length === 0) {
			content = content.slice(-remaining);
		  } else {
			break;
		  }
		}

		selected.unshift({
		  role: message.role,
		  content
		});

		remaining -= content.length;

		if (remaining <= 0) break;
	  }

	  return selected;
	}

    async function handleSend() {
      if (isGenerating) {
        if (activeController) {
          activeController.abort();
        }
        return;
      }

      const text = chatInput.value.trim();

      if (!text) return;

      const userMessage = {
        role: 'user',
        content: text
      };

      messages.push(userMessage);
      appendMessage('user', text);

      chatInput.value = '';

      const responseContent = appendMessage('assistant');

      activeController = new AbortController();
      const requestController = activeController;

      let assistantText = '';

      setGeneratingState(true);

      function addContent(content) {
        assistantText += content;
        responseContent.textContent = assistantText;

        chatContainer.scrollTop =
          chatContainer.scrollHeight;
      }

      function updateThinking() {
        loadingIndicator.textContent =
          'DeepSeek is reasoning...';
      }

      loadingIndicator.textContent = 'DeepSeek is thinking...';

      try {
		const response = await fetch('/api/chat', {
		  method: 'POST',
		  headers: {
			'Content-Type': 'application/json',
			'Accept': 'text/event-stream, application/json'
		  },
		  body: JSON.stringify({
			model: MODEL,
			messages: buildRequestMessages(),
			stream: true,
			max_tokens: 4096
		  }),
		  signal: requestController.signal
		});

        await readStreamingResponse(
          response,
          addContent,
          updateThinking
        );

        if (assistantText.trim()) {
          messages.push({
            role: 'assistant',
            content: assistantText
          });
        } else if (!requestController.signal.aborted) {
          throw new Error(
            'Ollama finished without returning answer content. ' +
            'Check the model response and streaming format.'
          );
        }

      } catch (error) {
        if (error.name === 'AbortError') {
          if (assistantText.trim()) {
            messages.push({
              role: 'assistant',
              content: assistantText
            });
          } else {
            responseContent.textContent = 'Generation stopped.';
          }

        } else {
          responseContent.textContent =
            `Error: ${error.message}`;

          responseContent.classList.add('error');

          console.error('Chat request failed:', error);

          const index = messages.lastIndexOf(userMessage);

          if (index !== -1) {
            messages.splice(index, 1);
          }
        }

      } finally {
        if (activeController === requestController) {
          activeController = null;
          setGeneratingState(false);
          loadingIndicator.textContent = 'DeepSeek is thinking...';
          chatInput.focus();
        }
      }
    }

    sendBtn.addEventListener('click', handleSend);

    chatInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });

    newChatBtn.addEventListener('click', () => {
      if (activeController) {
        activeController.abort();
      }

      messages.length = 0;
      chatContainer.replaceChildren();

      activeController = null;
      setGeneratingState(false);

      chatInput.value = '';
      chatInput.focus();
    });

    checkHealth();
  </script>
</body>
</html>
